name: Build C++ with MinGW x64 Release

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-mingw-x64.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build Windows x64 Release with MinGW
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 and build tools (x64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Fetch Tracy headers
        shell: msys2 {0}
        run: |
          if [ -d tracy ]; then rm -rf tracy; fi
          git clone --depth 1 https://github.com/wolfpld/tracy.git tracy

      - name: Configure CMake (Release, MinGW x64)
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -static-libwinpthread"

      - name: Build Windows x64 binary
        shell: msys2 {0}
        run: |
          cmake --build build --config Release --parallel
          cp build/luxon_server.exe build/luxon_server.release.windows-x86_64.exe

      - name: Upload Windows x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: luxon_server.release.windows-x86_64.exe
          path: build/luxon_server.release.windows-x86_64.exe
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64 Release with MinGW
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 and build tools (x64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Fetch Tracy headers
        shell: msys2 {0}
        run: |
          if [ -d tracy ]; then rm -rf tracy; fi
          git clone --depth 1 https://github.com/wolfpld/tracy.git tracy

      - name: Configure CMake (Release, MinGW x64 for Linux)
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -static-libwinpthread"

      - name: Build Linux x64 binary
        shell: msys2 {0}
        run: |
          cmake --build build --config Release --parallel
          cp build/luxon_server.exe build/luxon_server.release.linux-x86_64

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: luxon_server.release.linux-x86_64
          path: build/luxon_server.release.linux-x86_64
          if-no-files-found: error
