name: Build C++ with MinGW x64 Release

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build Windows x64 Release with MinGW
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (x64)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: latest

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Fetch Tracy headers
        shell: powershell
        run: |
          if (Test-Path tracy) {
            Remove-Item -Recurse -Force tracy
          }
          git clone --depth 1 https://github.com/wolfpld/tracy.git tracy

      - name: Configure CMake (Release, MinGW x64)
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build Windows x64 binary
        shell: bash
        run: |
          cmake --build build --config Release --parallel
          cp build/luxon_server.exe build/luxon_server.release.windows-x86_64.exe

      - name: Upload Windows x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: luxon_server.release.windows-x86_64.exe
          path: build/luxon_server.release.windows-x86_64.exe
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64 Release with MinGW (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 cross-compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            cmake \
            ninja-build \
            git \
            build-essential

      - name: Fetch Tracy headers
        run: |
          rm -rf tracy
          git clone --depth 1 https://github.com/wolfpld/tracy.git tracy

      - name: Configure CMake (Release, MinGW x64 Linux target)
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build Linux x64 binary
        run: |
          cmake --build build --config Release --parallel
          cp build/luxon_server.exe build/luxon_server.release.linux-x86_64.exe

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: luxon_server.release.linux-x86_64.exe
          path: build/luxon_server.release.linux-x86_64.exe
          if-no-files-found: error
